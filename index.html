const FLOW = ["niche","need","goal","recommend","assets","link","scale","budget","budget_fit","deadline",
  "contact_way","phone","call_time","name","comment","confirm"];
const STEP_NAMES = {niche:"Сфера",need:"Задача",assets:"Что уже есть",scale:"Вариант",budget:"Бюджет",
  deadline:"Сроки",contact_way:"Связь",name:"Имя",comment:"Комментарий"};
const TEXT_STEPS = new Set(["link","phone","name","comment"]);
const FREE_TEXT_OK = new Set(["niche","assets","budget","deadline","call_time"]);
const INTERCEPT = new Set(["menu","human","greet","thanks","bye"]);
const lbl = (list, id) => { const o = list.find(x => x[0] === id); return o ? o[1].replace(/^[^\p{L}\p{N}]+/u, "") : (id || ""); };
const svcBy = id => SERVICES.find(s => s.id === id);
const scaleOf = a => { const s = svcBy(a.need); return s && s.scales.find(x => x.id === a.scale); };
const needShort = { site:"сайт", bot:"бота", app:"мини-приложение", ads:"рекламу", seo:"продвижение", pack:"комплекс" };
const FAST = matchMedia("(prefers-reduced-motion: reduce)").matches || window.__chatFast;
const CHAT_KEY = "fakt-chat-v2";

let CH = null;
function chatNew(){ return { log:[], a:{}, await:"", flow:"", confirming:false, sent:false, started:false }; }
function chatLoad(){
  try { CH = JSON.parse(localStorage.getItem(CHAT_KEY)) || null; } catch(e) { CH = null; }
  if (!CH || !Array.isArray(CH.log)) CH = chatNew();
}
function chatSave(){
  try { CH.log = CH.log.slice(-80); localStorage.setItem(CHAT_KEY, JSON.stringify(CH)); } catch(e) {}
}

/* ---------- экран ---------- */
function Chat(){
  hideButton();
  return `<div class="chat" role="region" aria-label="Чат с помощником ${CONFIG.BRAND}">
    <div class="chat-head">
      <img src="assistant.webp" alt="">
      <div class="who"><b>Помощник ${CONFIG.BRAND}</b><small>отвечает сразу, заявку передаёт ${CONFIG.OWNER_DAT}</small></div>
      <button type="button" class="icon" data-act="chat-reset" aria-label="Начать заново" title="Начать заново">${I.reset}</button>
    </div>
    <div class="chat-log" id="chatlog" aria-live="polite"></div>
    <form class="chat-input" id="chatform">
      <textarea id="chatinput" rows="1" placeholder="Напишите сообщение…" aria-label="Сообщение" enterkeyhint="send"></textarea>
      <button type="submit" class="send" aria-label="Отправить" disabled>${I.send}</button>
    </form>
  </div>`;
}

function mountChat(){
  const log = app.querySelector("#chatlog");
  document.documentElement.classList.toggle("chat-open", !!log);
  if (!log) return;
  log.innerHTML = "";
  CH.log.forEach((m, i) => log.appendChild(msgEl(m, i === CH.log.length - 1)));
  scrollChat(true);
  const form = app.querySelector("#chatform"), input = app.querySelector("#chatinput"), sendBtn = form.querySelector(".send");
  const grow = () => { input.style.height = "44px"; input.style.height = Math.min(120, input.scrollHeight) + "px";
    sendBtn.disabled = !input.value.trim(); };
  input.addEventListener("input", grow);
  input.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); form.requestSubmit(); } });
  form.onsubmit = ev => { ev.preventDefault(); const t = input.value.trim(); if (!t) return;
    input.value = ""; grow(); userText(t); };
  app.querySelector("[data-act=chat-reset]").onclick = () => {
    CH = chatNew(); chatSave(); log.innerHTML = ""; chatStart();
  };
  if (!CH.started) chatStart(CH.preset);
}

function msgEl(m, isLast){
  const frag = document.createDocumentFragment();
  if (m.html){
    const d = document.createElement("div");
    d.className = m.who === "sys" ? "sys" : `msg ${m.who}`;
    d.innerHTML = m.html;
    frag.appendChild(d);
  }
  if (m.quick && m.quick.length && !m.done){
    const q = document.createElement("div");
    q.className = "quick";
    m.quick.forEach((b, i) => {
      const el = document.createElement("button");
      el.type = "button";
      el.textContent = b.label;
      if (b.cls) el.className = b.cls;
      el.onclick = () => onQuick(m, b);
      q.appendChild(el);
    });
    frag.appendChild(q);
  }
  return frag;
}

function scrollChat(instant){
  const log = app.querySelector("#chatlog"); if (!log) return;
  log.scrollTo({ top: log.scrollHeight, behavior: instant || FAST ? "auto" : "smooth" });
}

function pushMsg(m){
  CH.log.push(m); chatSave();
  const log = app.querySelector("#chatlog");
  if (log){
    const el = msgEl(m, true);
    [...el.children].forEach(c => c.classList.add("new"));
    log.appendChild(el); scrollChat();
  }
}

let sayQueue = Promise.resolve();
const sleep = ms => new Promise(r => setTimeout(r, ms));
function say(html, quick){
  sayQueue = sayQueue.then(async () => {
    const log = app.querySelector("#chatlog");
    if (!FAST && log){
      const t = document.createElement("div"); t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
      log.appendChild(t); scrollChat();
      await sleep(Math.min(1100, 380 + html.replace(/<[^>]+>/g, "").length * 6));
      t.remove();
    }
    pushMsg({ who:"bot", html, quick: quick || [] });
  });
  return sayQueue;
}
function me(text){ closeQuick(); pushMsg({ who:"me", html: esc(text) }); haptic.tap(); }
function sys(text){ pushMsg({ who:"sys", html: esc(text) }); }
function closeQuick(){
  let changed = false;
  CH.log.forEach(m => { if (m.quick && m.quick.length && !m.done){ m.done = true; changed = true; } });
  if (changed){ chatSave(); app.querySelectorAll("#chatlog .quick").forEach(q => q.remove()); }
}

/* ---------- кнопки ---------- */
const Q = (label, val, cls) => ({ label, val, cls });
function onQuick(m, b){
  if (m.done) return;
  me(b.label);
  const [kind, ...rest] = String(b.val).split(":");
  const arg = rest.join(":");
  if (kind === "s") return answerChoice(arg.split("=")[0], arg.split("=")[1]);
  if (kind === "faq") return faqAnswer(arg, false, true);
  if (kind === "svc") return serviceInfo(arg);
  if (kind === "go") return actions[arg] && actions[arg]();
  if (kind === "quizneed") return beginQuiz({ need: arg });
  if (kind === "faqpage") return faqMenu(+arg);
}
const actions = {
  quiz: () => beginQuiz(),
  prices: () => showPrices(),
  faq: () => faqMenu(0),
  dm: () => { CH.await = "question"; chatSave(); say(`Напишите вопрос одним сообщением, и я передам его ${CONFIG.OWNER_DAT}. Ответ придёт вам в Telegram от бота.`); },
  ask_now: () => sendQuestion((CH.a.questions || []).slice(-1)[0] || ""),
  menu: () => chatMenu(),
  resume: () => CH.await ? ask(CH.await) : chatMenu(),
  resend: () => sendLead(),
  retry_q: () => sendQuestion(CH.pendingQ || ""),
  cabinet: () => switchTab("cabinet"),
  home: () => switchTab("home"),
  calc: () => startCalc(),
  works: () => switchTab("works"),
  promo: () => openPromo("bot"),
  promo_site: () => openPromo("site"),
};

/* ---------- начало и меню ---------- */
function chatStart(preset){
  CH.started = true; delete CH.preset; chatSave();
  const name = tgUser && tgUser.first_name ? `, ${esc(tgUser.first_name)}` : "";
  say(`Здравствуйте${name}! Я помощник ${CONFIG.BRAND} 👋<br>Подберу решение для вашего бизнеса, назову ориентир по цене и передам заявку ${CONFIG.OWNER_DAT}, проекты он ведёт лично.`);
  if (preset && preset.need) return beginQuiz(preset);
  chatMenu("С чего начнём?");
}
function chatMenu(text){
  CH.await = ""; CH.flow = ""; chatSave();
  say(text || "Чем ещё помочь?", [Q("🎯 Подобрать решение", "go:quiz"), Q("💰 Цены", "go:prices"),
    Q("❓ Частые вопросы", "go:faq"), Q(`✈️ Написать ${CONFIG.OWNER_DAT}`, "go:dm")]);
}
function showPrices(){
  const rows = SERVICES.map(s => `<b>${s.title}</b>: от ${Math.min(...s.scales.map(x => x.price[0]))} тыс ₽`).join("<br>");
  say(`Цены ориентировочные, точную сумму ${CONFIG.OWNER_NAME} назовёт после бесплатного разбора. Предоплаты нет.<br><br>${rows}`,
    SERVICES.map(s => Q(s.title, "svc:" + s.id)).concat([Q("🎯 Подобрать решение", "go:quiz", "primary")]));
}
function serviceInfo(id, inStep){
  const s = svcBy(id); if (!s) return;
  const rows = s.scales.map(x => `• ${x.title}: ${fmtRange(x.price)} тыс ₽, ${weeksText(x.weeks)}`).join("<br>");
  const monthly = s.extras.find(x => x.monthly);
  const html = `<b>${s.title}</b><br>${s.desc}.<br><br>${rows}${monthly ? `<br>• ${monthly.title}: ${fmtRange(monthly.monthly)} тыс ₽/мес` : ""}`;
  if (inStep) return say(html);
  say(html, [Q(`🎯 Подобрать ${needShort[id]}`, "quizneed:" + id, "primary"), Q("💰 Все цены", "go:prices")]);
}
const FAQ_PAGE = 8;
function faqMenu(page){
  const list = KB.filter(e => e.faq), pages = Math.ceil(list.length / FAQ_PAGE);
  page = Math.min(Math.max(0, page || 0), pages - 1);
  const part = list.slice(page * FAQ_PAGE, (page + 1) * FAQ_PAGE);
  say(page ? `Ещё вопросы (${page + 1} из ${pages}):` : "Частые вопросы. Выберите или напишите вопрос своими словами:",
    part.map(e => Q(e.t, "faq:" + e.id, "wide"))
      .concat(page < pages - 1 ? [Q("Ещё вопросы →", "faqpage:" + (page + 1))] : [Q("↺ К началу списка", "faqpage:0")])
      .concat([Q("🎯 Подобрать решение", "go:quiz")]));
}
function faqAnswer(id, inStep, viaButton){
  const e = KB.find(x => x.id === id); if (!e || !e.a) return;
  const next = (e.next || [["🎯 Подобрать решение", "go:quiz"], ["❓ Другие вопросы", "go:faq"]]).map(n => Q(n[0], n[1], n[2]));
  say((viaButton && e.t ? `<b>${e.t}</b><br>` : "") + e.a, inStep ? [] : next);
}

/* ---------- анкета ---------- */
function beginQuiz(preset){
  const keep = {}; ["name","phone"].forEach(k => { if (CH.a[k]) keep[k] = CH.a[k]; });
  CH.a = Object.assign(keep, preset || {}); CH.flow = "quiz"; CH.confirming = false; CH.sent = false;
  if (CH.a.promo){
    const P = promoOf(CH.a);
    say(`🔥 <b>${P.title}</b><br><br>Что входит:<br>${P.includes.map(x => "• " + x).join("<br>")}<br><br>Обычная цена такого ${P.whatGen} ${P.regular}.${P.note ? " " + P.note + "." : ""} ${P.limit}. Предоплаты нет.<br><br>Задам пару вопросов, и заявка уйдёт ${CONFIG.OWNER_DAT}.`);
  } else say("Подберём решение, это 1–2 минуты, в основном кнопками. В любой момент можно задать вопрос текстом.");
  askNext();
}
function budgetMax(a){ const b = CHAT.budgets.find(x => x[0] === a.budget); return b ? b[2] : null; }
function needed(step){
  const a = CH.a;
  if (step in a) return false;
  if (a.promo && ["goal","recommend","scale","budget","budget_fit"].includes(step)) return false;
  switch (step){
    case "goal": return a.need === "unknown";
    case "recommend": return a.need === "unknown" && "goal" in a;
    case "link": return ["site","tilda","social"].includes(a.assets);
    case "scale": return !!a.need && a.need !== "unknown";
    case "budget_fit": { const s = scaleOf(a), mx = budgetMax(a); return !!(s && mx !== null && s.price[0] > mx); }
    case "phone": return ["call","wa"].includes(a.contact_way) && !a.phone;
    case "call_time": return ["call","wa"].includes(a.contact_way);
    case "name": return !a.name;
  }
  return true;
}
const nextStep = () => FLOW.find(needed);
const remaining = () => FLOW.filter(s => s !== "confirm" && needed(s)).length;
function askNext(){
  const step = nextStep();
  if (!step) return chatMenu();
  if (step === "confirm") CH.confirming = true;
  ask(step);
}
function ask(step){
  if (step.endsWith("_text")) step = step.slice(0, -5);
  if (step === "edit_pick") step = "confirm";
  CH.await = step; chatSave();
  const a = CH.a, opts = list => list.map(([v, t]) => Q(t, `s:${step}=${v}`));
  let q = "", quick = [];
  switch (step){
    case "niche": q = "Чем занимается ваш бизнес?"; quick = opts(CHAT.niches); break;
    case "need": q = a.self_pick ? "Выберите, что вам ближе:" : "Что нужно сделать?";
      quick = opts(CHAT.needs.filter(n => !(a.self_pick && n[0] === "unknown"))); break;
    case "goal": q = "Подскажу! Какая главная задача сейчас?"; quick = opts(CHAT.goals).map(b => (b.cls = "wide", b)); break;
    case "recommend": {
      const [need, sc, why] = CHAT.recommend[a.goal], s = svcBy(need), x = s.scales.find(v => v.id === sc);
      q = `Под вашу задачу подойдёт: <b>${svcLine(s, x)}</b><br>${why}<br><br>Ориентир: ${fmtRange(x.price)} тыс ₽, ${weeksText(x.weeks)}. Подходит?`;
      quick = [Q("👍 Подходит", "s:recommend=ok", "primary"), Q("Выберу сам", "s:recommend=self")]; break; }
    case "assets": q = "Что у вас уже есть?"; quick = opts(CHAT.assets); break;
    case "link": q = `Пришлите ссылку на сайт или соцсети, ${CONFIG.OWNER_NAME} посмотрит перед разговором.`; quick = [Q("Пропустить", "s:link=skip")]; break;
    case "scale": { const s = svcBy(a.need);
      q = `<b>${s.title}</b>: какой вариант ближе? Цены в тыс ₽.`;
      quick = s.scales.map(x => Q(`${x.title} · ${fmtRange(x.price)}`, `s:scale=${x.id}`, "wide"))
        .concat([Q("🤷 Не знаю, нужен совет", "s:scale=advice", "wide")]); break; }
    case "budget": q = "На какой бюджет ориентируетесь? Можно написать сумму."; quick = opts(CHAT.budgets); break;
    case "budget_fit": { const s = svcBy(a.need), x = scaleOf(a), mx = budgetMax(a);
      q = `«${x.title}» обычно стоит ${fmtRange(x.price)} тыс ₽, это выше бюджета. Есть варианты:`;
      quick = s.scales.filter(v => v.price[0] <= mx && v.id !== x.id).slice(0, 3)
        .map(v => Q(`Взять «${v.title}» · ${fmtRange(v.price)}`, `s:budget_fit=sc_${v.id}`, "wide"))
        .concat([Q("🪜 Сделать поэтапно", "s:budget_fit=stage", "wide"), Q("Оставить выбранный вариант", "s:budget_fit=keep", "wide"),
          Q(`Обсудить с ${CONFIG.OWNER_INS}`, "s:budget_fit=talk", "wide")]); break; }
    case "deadline": q = "Когда нужно запустить?"; quick = opts(CHAT.deadlines); break;
    case "contact_way": q = `Как ${CONFIG.OWNER_DAT} лучше связаться с вами?`; quick = opts(CHAT.ways.filter(w => IN_TG || w[0] !== "tg")); break;
    case "phone": q = "Ваш номер телефона?";
      quick = (can("6.9") ? [Q("📱 Поделиться номером", "s:phone=share", "primary")] : []).concat([Q("Пропустить", "s:phone=skip")]);
      if (!can("6.9")) q += " Напишите его сообщением.";
      break;
    case "call_time": q = "Когда удобно поговорить? (по Москве)"; quick = opts(CHAT.times); break;
    case "name": { const n = tgUser && tgUser.first_name;
      q = "Как к вам обращаться?" + (n ? "" : " Напишите имя.");
      quick = n ? [Q(n.slice(0, 30), "s:name=tg"), Q("✏️ Другое имя", "s:name=other")] : []; break; }
    case "comment": q = "Хотите что-то добавить? Например, пожелания или пример сайта, который нравится."; quick = [Q("Пропустить", "s:comment=skip")]; break;
    case "confirm": q = leadSummaryHtml() + "<br>Всё верно?";
      quick = [Q(`✈️ Отправить ${CONFIG.OWNER_DAT}`, "s:confirm=send", "primary wide"), Q("✏️ Изменить ответ", "s:confirm=edit"), Q("✖️ Отменить", "s:confirm=cancel")]; break;
  }
  const left = remaining();
  if (!["confirm","recommend","budget_fit"].includes(step) && !CH.confirming && left > 1) q += `<br><small style="color:var(--muted)">Осталось вопросов: ${left}</small>`;
  say(q, quick);
}

function answerChoice(step, val){
  const a = CH.a;
  if (step !== CH.await && !(step === "edit_pick" && CH.await === "edit_pick")) return;
  switch (step){
    case "niche": if (val === "other"){ CH.await = "niche_text"; chatSave(); return say("Напишите в двух словах, чем занимаетесь."); }
      a.niche = lbl(CHAT.niches, val); break;
    case "need": a.need = val; ["scale","budget_fit","goal"].forEach(k => delete a[k]); break;
    case "goal": a.goal = val; break;
    case "recommend": { const [need, sc] = CHAT.recommend[a.goal];
      if (val === "ok"){ a.need = need; a.scale = sc; a.recommend = "принял рекомендацию"; }
      else { delete a.need; a.self_pick = true; a.recommend = "выбрал сам"; } break; }
    case "assets": if (val === "other"){ CH.await = "assets_text"; chatSave(); return say("Что именно есть? Напишите коротко."); }
      a.assets = val; break;
    case "link": a.link = "skip"; break;
    case "scale": a.scale = val; delete a.budget_fit; break;
    case "budget": a.budget = val; delete a.budget_fit; delete a.budget_text; break;
    case "budget_fit": a.budget_fit = val.startsWith("sc_") ? (a.scale = val.slice(3), "выбрал вариант под бюджет")
      : { stage:"хочет поэтапно", keep:"оставил вариант дороже бюджета", talk:`хочет обсудить с ${CONFIG.OWNER_INS}` }[val]; break;
    case "deadline": a.deadline = val; break;
    case "contact_way": a.contact_way = val; if (val === "tg") delete a.call_time; break;
    case "phone":
      if (val === "share") return requestPhone();
      a.contact_way = "tg"; delete a.call_time; say(`Хорошо, ${CONFIG.OWNER_NAME} напишет вам в Telegram.`); break;
    case "call_time": if (val === "other"){ CH.await = "call_time_text"; chatSave(); return say("Напишите удобное время, например: «завтра после 14»."); }
      a.call_time = lbl(CHAT.times, val); break;
    case "name": if (val === "other"){ CH.await = "name"; chatSave(); return say("Напишите, как к вам обращаться."); }
      a.name = tgUser.first_name.slice(0, 40); break;
    case "comment": a.comment = "skip"; break;
    case "confirm":
      if (val === "send") return sendLead();
      if (val === "cancel"){ Object.assign(CH, { await:"", flow:"", confirming:false }); chatSave();
        return chatMenu("Отменил, ответы не отправлены. Если передумаете, я здесь."); }
      if (val === "edit"){ CH.await = "edit_pick"; chatSave();
        const fields = ["niche","need","assets","scale","budget","deadline","contact_way","name","comment"];
        return say("Что исправить?", fields.map(f => Q(STEP_NAMES[f], `s:edit_pick=${f}`)).concat([Q("← Назад к проверке", "s:edit_pick=back")])); }
      break;
    case "edit_pick":
      if (val !== "back"){
        const drop = { need:["need","goal","recommend","self_pick","scale","budget_fit"], scale:["scale","budget_fit"],
          budget:["budget","budget_fit","budget_text"], assets:["assets","link","assets_text"], contact_way:["contact_way","phone","call_time"] };
        (drop[val] || [val]).forEach(k => delete a[k]);
      }
      CH.confirming = true; break;
  }
  chatSave(); askNext();
}

function requestPhone(){
  if (!can("6.9")) return say("Напишите номер сообщением, например +7 921 123-45-67.");
  tg.requestContact((ok, res) => {
    const phone = ok && res && res.responseUnsafe && res.responseUnsafe.contact && res.responseUnsafe.contact.phone_number;
    if (phone){ CH.a.phone = normPhone(phone) || phone; sys(`Номер: ${CH.a.phone}`); chatSave(); askNext(); }
    else say("Номер не пришёл. Напишите его сообщением или нажмите «Пропустить».", [Q("Пропустить", "s:phone=skip")]);
  });
}
function normPhone(t){
  const d = String(t).replace(/\D/g, "");
  if (d.length === 11 && /[78]/.test(d[0])) return `+7 ${d.slice(1,4)} ${d.slice(4,7)}-${d.slice(7,9)}-${d.slice(9)}`;
  if (d.length === 10 && d[0] === "9") return `+7 ${d.slice(0,3)} ${d.slice(3,6)}-${d.slice(6,8)}-${d.slice(8)}`;
  if (d.length >= 10 && d.length <= 15 && String(t).trim().startsWith("+")) return "+" + d;
  return null;
}

/* ---------- текст от клиента ---------- */
/* Распознавание: ищем тему из KB, где совпало больше ключевых слов */
const normText = t => " " + String(t).toLowerCase().replace(/ё/g, "е").replace(/[^\p{L}\p{N}%+\-]+/gu, " ").replace(/\s+/g, " ").trim() + " ";
function kwHit(t, k){
  if (k instanceof RegExp) return k.test(t);                // сложное правило
  if (k[0] === "^") return t.trim() === k.slice(1);        // всё сообщение целиком
  if (k[0] === "=") return t.includes(` ${k.slice(1)} `);  // отдельное слово
  return t.includes(" " + k);                               // начало слова или фраза
}
let detectScore = 0;
function detect(text){
  const t = normText(text), scores = {};
  let best = null, bs = 0;
  for (const e of KB){
    let sc = 0;
    for (const k of e.k) if (kwHit(t, k)) sc += k instanceof RegExp || /\s/.test(k.replace(/^[=^]/, "")) ? 1.6 : 1;
    sc *= e.w || 1;
    if (sc) scores[e.id] = sc;
    if (sc > bs){ bs = sc; best = e; }
  }
  detectScore = bs;
  if (!best) return null;
  // конкретная тема важнее общей категории («бот для записи» → про запись, «сколько стоит хостинг» → про хостинг)
  if (best.act && best.act !== "menu"){
    const topic = KB.filter(e => !e.act && scores[e.id] >= 1).sort((a, b) => scores[b.id] - scores[a.id])[0];
    if (topic && scores[topic.id] >= bs - 1.5){ detectScore = scores[topic.id]; return "faq:" + topic.id; }
  }
  if (best.act === "price"){                               // «сколько стоит бот»: сразу цены на бота
    const sv = KB.filter(e => e.act === "svc" && scores[e.id]).sort((a, b) => scores[b.id] - scores[a.id])[0];
    if (sv) return sv.id;
  }
  return best.act ? best.id : "faq:" + best.id;
}
function userText(text){
  me(text);
  const step = CH.await, a = CH.a, intent = detect(text), question = /\?\s*$/.test(text);
  if (step === "question") return sendQuestion(text);
  if (step === "question_phone"){
    const p = normPhone(text); if (!p) return say("Похоже, в номере опечатка. Пример: +7 921 123-45-67.");
    a.phone = p; chatSave(); return sendQuestion(CH.pendingQ || "");
  }
  if (intent === "menu") return chatMenu("Хорошо. Чем помочь?");
  if (step.endsWith("_text")){
    const base = step.slice(0, -5);
    if (base === "assets"){ a.assets = "other"; a.assets_text = text.slice(0, 200); }
    else a[base] = text.slice(0, 120);
    chatSave(); return askNext();
  }
  if (step === "edit_pick") return say("Выберите кнопкой, что исправить 👆");
  if (step === "budget" && /\d/.test(text) && !question) return budgetFromText(text);
  if (TEXT_STEPS.has(step) && !question && intent !== "human") return answerText(step, text);
  if (step === "need" && intent && intent.startsWith("svc:") && !question){ closeQuick(); return answerChoice("need", intent.slice(4)); }
  if (step === "contact_way" && !question){
    const way = [["wa", /whats|ватс|вотс|вацап/], ["call", /позвон|звон|набер|телефон/], ["tg", /телеграм|telegram|(^|\s)тг(\s|$)|пиши|переписк/]]
      .find(([, rx]) => rx.test(text.toLowerCase()));
    if (way) return answerChoice("contact_way", way[0]);
  }
  const intercept = INTERCEPT.has(intent) || ((intent || "").startsWith("faq:") && (detectScore >= 1.6 || /^(как|что|где|когда|почему|зачем|сколько|можно|а |вы |есть )/i.test(text)));
  if (FREE_TEXT_OK.has(step) && !question && !intercept){
    if (step === "assets"){ a.assets = "other"; a.assets_text = text.slice(0, 200); }
    else a[step] = text.slice(0, 120);
    chatSave(); return askNext();
  }
  if (freeText(text, intent, !!step)){ if (step) reask(); return; }
  // не понял: сохраняем вопрос для мастера
  (a.questions = a.questions || []).push(text.slice(0, 300)); chatSave();
  say(`Хороший вопрос, на него точно ответит ${CONFIG.OWNER_NAME}. Добавлю его в заявку 📝` + (step ? "" : "<br>А ещё могу рассказать про цены, сроки, оплату и гарантии, загляните в частые вопросы."),
    [Q(`Спросить ${CONFIG.OWNER_DAT} сейчас`, "go:ask_now")].concat(step ? [] : [Q("❓ Частые вопросы", "go:faq"), Q("🎯 Подобрать решение", "go:quiz")]));
  if (step) reask();
}
function reask(){ if (CH.await && !CH.await.startsWith("question")){ say("Вернёмся к подбору 👇"); ask(CH.await); } }
function freeText(text, intent, inStep){
  if (!intent) return false;
  if (intent.startsWith("faq:")){ faqAnswer(intent.slice(4), inStep); return true; }
  if (intent.startsWith("svc:")){ serviceInfo(intent.slice(4), inStep); return true; }
  if (intent === "human"){
    say(`Конечно! Напишите вопрос, и я передам его ${CONFIG.OWNER_DAT}. Он ответит вам в Telegram через нашего бота.`,
      [Q(`✈️ Написать ${CONFIG.OWNER_DAT}`, "go:dm", "primary")].concat(inStep ? [] : [Q("Сначала подобрать решение", "go:quiz")]));
    return true;
  }
  if (intent === "price"){ inStep ? say("Цены зависят от задачи, точную вилку покажу в конце подбора.") : showPrices(); return true; }
  if (intent === "greet"){ inStep ? say("Здравствуйте! 👋") : chatMenu("Здравствуйте! Чем помочь?"); return true; }
  if (intent === "thanks"){ inStep ? say("Пожалуйста! 🙌") : chatMenu("Пожалуйста! 🙌 Чем ещё помочь?"); return true; }
  if (intent === "bye"){ say(`Всего доброго! Переписка сохранится: вернётесь и продолжите с того же места. ${inStep ? "" : "Если что, я здесь 👋"}`); return true; }
  return false;
}
function budgetFromText(text){
  const nums = (text.replace(/\s/g, "").match(/\d+(?:[.,]\d+)?/g) || []).map(x => parseFloat(x.replace(",", ".")));
  let n = Math.max(...nums);
  if (/млн|миллион/.test(text.toLowerCase())) n *= 1000; else if (n >= 1000) n /= 1000;
  CH.a.budget = CHAT.budgets.find(b => b[2] !== null && n <= b[2])[0];
  CH.a.budget_text = text.slice(0, 80); delete CH.a.budget_fit;
  chatSave(); askNext();
}
function answerText(step, text){
  const a = CH.a;
  if (step === "phone"){
    if (/^пропуст/i.test(text)) return answerChoice("phone", "skip");
    const p = normPhone(text);
    if (!p){
      CH.tries = (CH.tries || 0) + 1;
      if (CH.tries < 3) return say("Похоже, в номере опечатка. Пример: +7 921 123-45-67. Или нажмите «Пропустить».", [Q("Пропустить", "s:phone=skip")]);
      a.phone = text.slice(0, 30) + " (не проверен)";
    } else a.phone = p;
    CH.tries = 0;
  }
  if (step === "link") a.link = text.slice(0, 300);
  if (step === "name"){
    if (text.length < 2 || text.length > 40) return say("Напишите, пожалуйста, просто имя, например «Анна».");
    a.name = text;
  }
  if (step === "comment") a.comment = text.slice(0, 1000);
  chatSave(); askNext();
}

/* ---------- итог и отправка ---------- */
function chatEstimate(a){
  if (a.promo){ const P = promoOf(a); return { promo:true, text:`Акция: ${P.what} за ${P.price} (обычно ${P.regular})` }; }
  const x = scaleOf(a); if (!x) return null;
  const k = a.deadline === "rush" ? 1.25 : 1;
  return { min: r5(x.price[0] * k), max: r5(x.price[1] * k), weeks: weeksText(x.weeks) };
}
function contactLine(a){
  const way = { tg:"Telegram", call:"Позвонить", wa:"WhatsApp" }[a.contact_way || "tg"];
  return [way, a.phone, a.call_time].filter(Boolean).join(", ");
}
function leadRows(a){
  const x = scaleOf(a), s = svcBy(a.need);
  let task = s ? s.title : "";
  if (a.promo) task = promoOf(a).key === "site" ? `Сайт до 3 страниц по акции за ${promoOf(a).price}` : `Telegram-бот по акции за ${promoOf(a).price}`;
  else if (x) task = svcLine(s, x); else if (a.scale === "advice") task += ": нужен совет по варианту";
  let assets = a.assets_text || lbl(CHAT.assets, a.assets);
  if (a.link && a.link !== "skip") assets += ` (${a.link})`;
  return [
    ["Сфера", a.niche], ["Задача", task],
    ["Цель", a.goal ? lbl(CHAT.goals, a.goal) : ""],
    ["Что уже есть", a.assets ? assets : ""],
    ["Бюджет", (a.budget_text || lbl(CHAT.budgets, a.budget)) + (a.budget_fit ? ` (${a.budget_fit})` : "")],
    ["Сроки", CHAT.deadlines.some(d => d[0] === a.deadline) ? lbl(CHAT.deadlines, a.deadline) : a.deadline],
    ["Связь", contactLine(a)], ["Имя", a.name],
    ["Комментарий", a.comment && a.comment !== "skip" ? a.comment : ""],
  ].filter(([, v]) => v && String(v).trim());
}
function leadSummaryHtml(){
  const a = CH.a, e = chatEstimate(a);
  let h = `<b>Проверьте, всё ли верно:</b><div class="rows">` +
    leadRows(a).map(([k, v]) => `<div><span>${k}:</span> ${esc(v)}</div>`).join("") + `</div>`;
  if (e && e.promo){ const P = promoOf(a); h += `<div class="est">Цена по акции: <b>${P.price}</b>. Обычная цена такого ${P.whatGen} ${P.regular}.${P.note ? " " + P.note + "." : ""} Предоплаты нет: оплата после запуска.</div>`; }
  else if (e) h += `<div class="est">Предварительно: <b>${e.min}–${e.max} тыс ₽</b>, ${e.weeks}${a.deadline === "rush" ? " (срочно, +25%)" : ""}.<br>
    Точную сумму ${CONFIG.OWNER_NAME} назовёт после бесплатного разбора. Предоплаты нет.</div>`;
  return h;
}
function chatLeadText(){
  const a = CH.a, e = chatEstimate(a);
  const lines = [`Здравствуйте, ${CONFIG.OWNER_NAME}! Заявка из приложения ${CONFIG.BRAND}:`, ""]
    .concat(leadRows(a).map(([k, v]) => `${k}: ${v}`));
  if (e) lines.push(e.promo ? e.text : `Ориентир: ${e.min}–${e.max} тыс ₽, ${e.weeks}`);
  if (a.questions && a.questions.length) lines.push("", "Мои вопросы:", ...a.questions.map(q => "• " + q));
  return lines.join("\n").slice(0, 3900);
}
function chatDmText(){
  const a = CH.a, rows = leadRows(a);
  return `Здравствуйте, ${CONFIG.OWNER_NAME}! Пишу из приложения ${CONFIG.BRAND}.` +
    (rows.length ? "\n\n" + rows.map(([k, v]) => `${k}: ${v}`).join("\n") : "") +
    (a.questions && a.questions.length ? "\n\nВопрос: " + a.questions[a.questions.length - 1] : "");
}
function chatQuestionText(){
  const q = (CH.a.questions || []).slice(-1)[0] || "";
  return `Здравствуйте, ${CONFIG.OWNER_NAME}! Вопрос из приложения ${CONFIG.BRAND}: ${q}`;
}
function promise(a){
  const t = (a.call_time || "").toLowerCase();
  if (a.contact_way === "call") return t ? `позвонит: ${t}` : "позвонит в течение рабочего дня";
  if (a.contact_way === "wa") return t ? `напишет в WhatsApp: ${t}` : "напишет в WhatsApp";
  return "ответит вам в Telegram через бота в течение рабочего дня";
}
async function sendLead(){
  const a = CH.a, e = chatEstimate(a), s = svcBy(a.need), x = scaleOf(a);
  CH.await = ""; CH.flow = ""; CH.confirming = false; chatSave();
  say("Отправляю заявку…");
  try {
    const rows = leadRows(a).concat((a.questions || []).length ? [["Вопросы", a.questions.join(" | ")]] : []);
    const res = await submitLead({ kind:"chat", title: a.promo ? `${promoOf(a).lead} ${promoOf(a).price}` : s && x ? svcLine(s, x) : s ? s.title : "Подбор решения", rows,
      estimate: e && e.promo ? e.text : e ? `Ориентир: ${e.min}–${e.max} тыс ₽, ${e.weeks}` + (a.deadline === "rush" ? " (срочно, +25%)" : "") : "" });
    CH.sent = true; chatSave(); haptic.ok();
    say(`✅ Заявка №${esc(res.id)} отправлена ${CONFIG.OWNER_DAT}.<br><br>${CONFIG.OWNER_NAME} ${promise(a)}. Статус и ответы видны во вкладке «Кабинет».`,
      [Q("👤 Открыть кабинет", "go:cabinet", "primary"), Q("☰ Меню", "go:menu")]);
  } catch(err) {
    haptic.err(); CH.confirming = true; CH.await = "confirm"; chatSave();
    say("Не получилось отправить заявку: нет связи с сервером. Проверьте интернет и попробуйте ещё раз.", [Q("↻ Отправить ещё раз", "go:resend", "primary"), Q("☰ Меню", "go:menu")]);
  }
}
async function sendQuestion(text){
  text = String(text || "").trim();
  if (!text){ CH.await = "question"; chatSave(); return say("Напишите вопрос одним сообщением."); }
  if (!IN_TG && !CH.a.phone){
    CH.pendingQ = text; CH.await = "question_phone"; chatSave();
    return say("Оставьте номер телефона: вы открыли приложение не в Telegram, и ответить получится только по телефону.");
  }
  CH.await = ""; delete CH.pendingQ; chatSave();
  const rows = [["Вопрос", text.slice(0, 600)]].concat(leadRows(CH.a).filter(([k]) => k !== "Комментарий"));
  if (!IN_TG && CH.a.phone && !rows.some(([k]) => k === "Телефон")) rows.push(["Телефон", CH.a.phone]);
  try {
    const res = await submitLead({ kind:"question", title:"Вопрос: " + text.slice(0, 50), rows });
    CH.a.questions = (CH.a.questions || []).filter(q => q !== text); chatSave(); haptic.ok();
    say(`✅ Передал ${CONFIG.OWNER_DAT} (№${esc(res.id)}). Ответ придёт ${IN_TG ? "в Telegram от бота" : "по телефону"} в течение рабочего дня.`,
      [Q("🎯 Подобрать решение", "go:quiz"), Q("☰ Меню", "go:menu")]);
  } catch(err) {
    haptic.err(); CH.pendingQ = text; chatSave();
    say("Не получилось отправить вопрос: нет связи с сервером. Попробуйте ещё раз.", [Q("↻ Отправить ещё раз", "go:retry_q", "primary")]);
  }
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e) {}
  try { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    const ok = document.execCommand("copy"); t.remove(); return ok; } catch(e) { return false; }
}
function openPromo(key){ const P = PROMOS[key] || CONFIG.PROMO; openChat({ need:P.need, scale:P.scale, promo:P.key }); }
function openChat(preset){
  const show = () => { if (S.screen !== "chat"){ trail.length = 0; S.screen = "chat"; render(); } };
  if (preset && CH.started){ show(); return beginQuiz(preset); }
  if (preset) CH.preset = preset;
  show();
}

/* ==========================================================
   Старт
   ========================================================== */
document.title = `${CONFIG.BRAND}: расчёт проекта`;
if (IN_TG){
  tg.ready(); tg.expand();
  if (can("7.7")) tg.disableVerticalSwipes();
  tg.onEvent("themeChanged", applyTheme);
  tg.onEvent("viewportChanged", e => { if (e && e.isStateStable){ stageHeight(); if (film) film.layout(); } });
} else {
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
}
stageHeight();
chatLoad();
applyTheme();
{ const h = (location.hash || "").replace("#", "");          // бот открывает приложение сразу на нужной вкладке
  const sp = IN_TG && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  const OK = ["works","chat","cabinet","promo","site"];
  const want = OK.includes(h) ? h : OK.includes(sp) ? sp : null;
  if (want === "promo") setTimeout(() => openPromo("bot"), 50);
  else if (want === "site") setTimeout(() => openPromo("site"), 50);
  else if (want) S.screen = want; }
render();
if (S.screen !== "cabinet" && (IN_TG || localLeads().length)) loadCabinet();
