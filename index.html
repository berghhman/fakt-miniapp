<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ФАКТ — расчёт проекта</title>
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<link rel="preload" href="fonts/geologica-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Шрифт Geologica лежит рядом с приложением — не зависит от Google Fonts */
@font-face{font-family:"Geologica";font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/geologica-cyrillic-wght-normal.woff2) format("woff2-variations"),url(fonts/geologica-cyrillic-wght-normal.woff2) format("woff2");
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Geologica";font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/geologica-latin-ext-wght-normal.woff2) format("woff2-variations"),url(fonts/geologica-latin-ext-wght-normal.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Geologica";font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/geologica-latin-wght-normal.woff2) format("woff2-variations"),url(fonts/geologica-latin-wght-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
</style>
<style>
/* ============ Цвета и шрифты ============ */
:root{
  --desk:#DFE2F8;      /* фон, «стол» — совпадает с фоном видео */
  --surface:#FFFFFF;   /* строки вариантов */
  --text:#131846;
  --muted:#626A8C;
  --line:#C8CDEB;
  --ink:#2433C4;       /* синие чернила печати — главный акцент */
  --ink-soft:#DCE0FA;
  --on-ink:#FFFFFF;
  --paper:#FFFFFF;     /* чек всегда бумажный */
  --paper-text:#1A1B2E;
  --paper-muted:#6E7088;
  --stamp:#2433C4;
  --marker:#FFE45C;
  --film:#DFE2F8;      /* сцена с анимацией всегда светлая */
  --film-text:#131846;
  --film-muted:#4B5285;
  --film-ink:#2433C4;
  --danger:#C42F2F;
  --ui:"Geologica", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:var(--ui);   /* смета тем же шрифтом, что и всё приложение */
  --gutter:20px;
  --safe-b:env(safe-area-inset-bottom, 0px);
}
:root[data-theme="dark"]{
  --desk:#0F1333;
  --surface:#191E4A;
  --text:#ECEEFF;
  --muted:#A0A7CE;
  --line:#2D336A;
  --ink:#8E9BFF;
  --ink-soft:#252C68;
  --on-ink:#0F1333;
  --stamp:#8E9BFF;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--desk);color:var(--text)}
body{font-family:var(--ui);font-size:16px;line-height:1.5;min-height:100vh;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}

#app{max-width:520px;margin:0 auto;padding:16px var(--gutter) calc(170px + var(--safe-b))}
.screen{animation:enter .26s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.screen.back{animation-name:enter-back}
@keyframes enter-back{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

/* ============ Главный экран ============ */
.terms{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:36px}
.terms div{background:var(--surface);padding:14px 14px 13px}
.terms b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em}
.terms span{font-size:13px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}

h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:12px}
.services{list-style:none;margin-bottom:36px;border-top:1px solid var(--line)}
.services li{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:start;
  padding:16px 0;border-bottom:1px solid var(--line)}
.services .ico{width:40px;height:40px;border-radius:11px;background:var(--ink-soft);color:var(--ink);
  display:grid;place-items:center}
.services .ico svg{width:22px;height:22px}
.services h3{font-size:16px;font-weight:600;line-height:1.3}
.services p{font-size:14px;color:var(--muted);line-height:1.4;margin-top:3px}
.services .from{font-size:13px;color:var(--muted);white-space:nowrap;padding-top:2px}
.services .from b{color:var(--text);font-weight:600}

.selfnote{font-size:14px;color:var(--muted);border-left:3px solid var(--ink);padding:4px 0 4px 14px;margin-bottom:12px}


/* ============ Кино на скролле ============ */
.film{position:relative;height:calc(var(--stage-h,100vh) * 6);margin:-16px calc(-1 * var(--gutter)) 28px;
  background:var(--film);color:var(--film-text);border-radius:0 0 28px 28px}
.film-stage{position:sticky;top:0;height:var(--stage-h,100vh);overflow:hidden;border-radius:inherit}
.film canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.film-veil{position:absolute;left:0;right:0;top:0;height:var(--copy-h,180px);pointer-events:none;
  background:linear-gradient(var(--film) 58%, rgba(223,226,248,0))}
.ch{position:absolute;left:var(--gutter);right:var(--gutter);top:20px;opacity:0;will-change:opacity,transform}
.ch h1,.ch h2{font-size:clamp(27px,7.6vw,33px);font-weight:800;line-height:1.04;letter-spacing:-.022em;max-width:13ch;margin:0 0 9px}
.ch p{font-size:15.5px;line-height:1.4;color:var(--film-muted);max-width:30ch}
.ch .brandmark{display:block;font-weight:900;font-size:19px;letter-spacing:.06em;line-height:1;color:var(--film-ink);margin:4px 0 14px}
.film-stamp{position:absolute;color:var(--film-ink);opacity:0;pointer-events:none;will-change:transform,opacity}
.film-stamp svg{width:100%;height:100%;display:block}
.film-hint{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:13.5px;font-weight:600;color:var(--film-ink)}
.film-hint svg{width:18px;height:18px;flex:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* ============ Почему ФАКТ ============ */
.facts{list-style:none;margin:0 0 38px;border-top:1px solid var(--line)}
.facts li{padding:18px 0 17px;border-bottom:1px solid var(--line)}
.facts .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.facts b{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.seal{display:inline-block;border:2px solid var(--ink);color:var(--ink);border-radius:7px;padding:3px 9px 4px;
  font-weight:800;font-size:15px;line-height:1.1;transform:rotate(-4deg);letter-spacing:.01em}
.facts li:nth-child(2) .seal{transform:rotate(3deg)}
.facts li:nth-child(3) .seal{transform:rotate(-2deg)}
.facts li:nth-child(4) .seal{transform:rotate(2.5deg)}
.facts p{font-size:15px;color:var(--muted);margin-top:8px;max-width:34ch}


/* ============ Квиз ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;min-height:28px}
.backlink{display:none;align-items:center;gap:4px;color:var(--muted);font-size:15px;padding:4px 6px 4px 0}
.backlink svg{width:18px;height:18px}
.no-tg .backlink{display:inline-flex}
.progress{flex:1;display:flex;align-items:center;gap:12px;justify-content:flex-end}
.progress .count{font-size:13px;color:var(--muted);white-space:nowrap}
.progress .bar{width:96px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .3s ease}

.q h1{font-size:28px;font-weight:750;line-height:1.12;letter-spacing:-.02em;margin-bottom:8px}
.q .hint{color:var(--muted);font-size:15px;margin-bottom:22px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1.5px solid transparent;border-radius:14px;padding:15px 16px;
  transition:border-color .15s, background .15s}
.opt.has-ico{grid-template-columns:36px 1fr auto}
.opt .ico{width:36px;height:36px;border-radius:10px;background:var(--ink-soft);color:var(--ink);display:grid;place-items:center}
.opt .ico svg{width:20px;height:20px}
.opt b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.opt small{display:block;font-size:14px;color:var(--muted);line-height:1.35;margin-top:2px}
.opt .price{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
.opt .mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.opt.multi .mark{border-radius:7px}
.opt .mark svg{width:14px;height:14px;opacity:0;color:var(--on-ink)}
.opt[aria-checked="true"]{border-color:var(--ink)}
.opt[aria-checked="true"] .mark{background:var(--ink);border-color:var(--ink)}
.opt[aria-checked="true"] .mark svg{opacity:1}
.opt .right{display:flex;align-items:center;gap:10px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1.5px solid transparent;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:500}
.chip[aria-checked="true"]{border-color:var(--ink);color:var(--ink)}

/* полоска предварительной суммы */
.peek{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));width:calc(100% - 2*var(--gutter));max-width:480px;
  background:var(--paper);color:var(--paper-text);border-radius:12px 12px 4px 4px;padding:11px 14px;
  display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:14px;
  box-shadow:0 10px 30px -12px rgba(15,19,51,.35);z-index:5;transition:bottom .2s}
.peek b{font-weight:600}
.no-tg .peek{bottom:calc(84px + var(--safe-b))}

/* ============ Чек-смета ============ */
.result h1{font-size:28px;font-weight:750;line-height:1.12;letter-spacing:-.02em;margin-bottom:8px}
.result .hint{color:var(--muted);font-size:15px;margin-bottom:22px}

.receipt{--stamp:#2433C4;position:relative;background:var(--paper);color:var(--paper-text);font-family:var(--mono);
  font-size:14px;line-height:1.45;padding:22px 18px 26px;margin:14px 0 34px;
  box-shadow:0 18px 40px -22px rgba(15,19,51,.45)}
.receipt::before,.receipt::after{content:"";position:absolute;left:0;right:0;height:10px;
  background:radial-gradient(circle at 7px 0, var(--desk) 6.5px, transparent 7px) repeat-x;background-size:14px 10px}
.receipt::before{top:0}
.receipt::after{bottom:0;transform:scaleY(-1)}
.r-head{text-align:center;margin-bottom:14px}
.r-head .wm{font-family:var(--ui);font-weight:900;font-size:20px;letter-spacing:.06em;color:var(--stamp)}
.r-head div{font-size:12.5px;color:var(--paper-muted)}
.r-cut{border:0;border-top:1.5px dashed #C9CBD8;margin:12px 0}
.r-row{display:flex;align-items:baseline;gap:6px}
.r-row .l{flex:0 1 auto}
.r-row .dots{flex:1;border-bottom:1.5px dotted #B9BBCB;transform:translateY(-4px);min-width:12px}
.r-row .v{flex:none;white-space:nowrap}
.r-row + .r-row{margin-top:6px}
.r-sub{font-size:12.5px;color:var(--paper-muted)}
.r-total{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:15px}
.r-total .sum{font-size:21px;font-weight:600;padding:0 4px;
  background:linear-gradient(transparent 52%, var(--marker) 52% 92%, transparent 92%)}
.r-foot{font-size:12.5px;color:var(--paper-muted);margin-top:12px;padding-right:128px;min-height:118px}
.r-group{font-family:var(--ui);font-weight:700;font-size:15px;margin-bottom:8px}
.receipt .stamp{position:absolute;right:6px;bottom:16px;width:128px;height:128px;transform:rotate(-14deg);opacity:.9;pointer-events:none}
.receipt .stamp.land{animation:land .5s cubic-bezier(.2,.9,.3,1.25) .45s both}
@keyframes land{0%{opacity:0;transform:rotate(-24deg) scale(1.7)}60%{opacity:.95}100%{opacity:.9;transform:rotate(-14deg) scale(1)}}

/* форма */
.form h2{margin-bottom:4px}
.form .hint{color:var(--muted);font-size:15px;margin-bottom:16px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:13px 14px;font-size:16px;outline:none;transition:border-color .15s;resize:none}
.field input:focus,.field textarea:focus{border-color:var(--ink)}
.field.err input{border-color:var(--danger)}
.field .msg{display:none;color:var(--danger);font-size:13px;margin-top:5px}
.field.err .msg{display:block}
.toggle{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border-radius:12px;padding:13px 14px;margin-bottom:14px;width:100%;text-align:left}
.toggle .sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle[aria-checked="true"] .sw{background:var(--ink)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(18px)}
.privacy{font-size:12.5px;color:var(--muted);margin-top:6px}
.error-box{display:none;background:var(--surface);border:1.5px solid var(--danger);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
.error-box.on{display:block}
.error-box button{color:var(--ink);font-weight:600;margin-top:6px;text-decoration:underline;text-underline-offset:3px}

/* ============ Готово ============ */
.done{padding-top:24px}
.done .stamp{width:150px;height:150px;transform:rotate(-10deg);margin:0 0 26px -6px;display:block}
.done h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:12px}
.done p{color:var(--muted);max-width:34ch;margin-bottom:10px}
.textlink{color:var(--ink);font-weight:600;margin-top:22px;display:inline-block;text-decoration:underline;text-underline-offset:4px}

/* ============ Карточка чата на главной ============ */
.chatcard{display:grid;grid-template-columns:52px 1fr;gap:4px 14px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border-radius:18px;padding:14px 14px 14px;margin:0 0 36px}
.chatcard img{width:52px;height:52px;border-radius:50%;grid-row:span 2}
.chatcard b{font-size:16.5px;font-weight:700;line-height:1.25}
.chatcard small{font-size:14px;color:var(--muted);line-height:1.35}
.chatcard .bubble{grid-column:1/-1;margin-top:10px;background:var(--desk);border-radius:14px 14px 14px 6px;padding:10px 12px;font-size:14.5px;line-height:1.4}
.chatcard .go{grid-column:1/-1;margin-top:10px;height:46px;border-radius:12px;background:var(--ink-soft);color:var(--ink);
  font-weight:650;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.chatcard .go svg{width:18px;height:18px}
.services li[data-chatneed]{cursor:pointer}
.services li[data-chatneed]:active{opacity:.6}
.svc-hint{font-size:14px;color:var(--muted);margin:-6px 0 12px}

/* ============ Чат с помощником ============ */
html.chat-open, html.chat-open body{overflow:hidden}
.chat{position:fixed;left:0;right:0;top:0;height:var(--tg-viewport-height,100dvh);max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;background:var(--desk);z-index:4}
.chat-head{display:flex;align-items:center;gap:12px;padding:10px var(--gutter);border-bottom:1px solid var(--line)}
.chat-head img{width:42px;height:42px;border-radius:50%;flex:none}
.chat-head .who{flex:1;min-width:0}
.chat-head b{display:block;font-size:16px;font-weight:700;line-height:1.2}
.chat-head small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.chat-head .icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.chat-head .icon svg{width:20px;height:20px}
.chat-head .back{display:none}
.no-tg .chat-head .back{display:grid}
.chat-log{flex:1;overflow-y:auto;padding:14px var(--gutter) 10px;display:flex;flex-direction:column;gap:6px;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.msg{max-width:86%;padding:9px 13px 10px;border-radius:18px;font-size:15.5px;line-height:1.42;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.bot + .msg.me, .msg.me + .msg.bot, .quick + .msg{margin-top:8px}
.msg b{font-weight:650}
.msg .rows{margin-top:6px;display:grid;gap:3px;font-size:14.5px}
.msg .rows span{color:var(--muted)}
.msg .est{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:14.5px}
.msg .est b{background:linear-gradient(transparent 55%, var(--marker) 55% 92%, transparent 92%);padding:0 2px}
:root[data-theme="dark"] .msg .est b{background:var(--marker);color:#1A1B2E;border-radius:4px;padding:0 4px}
.sys{align-self:center;font-size:12.5px;color:var(--muted);margin:6px 0 2px;text-align:center}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px;max-width:100%}
.quick button{border:1.5px solid var(--ink);color:var(--ink);background:transparent;border-radius:999px;
  padding:8px 13px;font-size:14.5px;font-weight:560;line-height:1.25;text-align:left}
.quick button.primary{background:var(--ink);color:var(--on-ink)}
.quick button.wide{width:100%;border-radius:14px}
.quick button:active{transform:scale(.97)}
.typing{align-self:flex-start;background:var(--surface);border-radius:18px;border-bottom-left-radius:6px;padding:13px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.35;animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{40%{opacity:1}}
.msg.new,.quick.new{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chat-input{display:flex;gap:8px;align-items:flex-end;padding:8px var(--gutter) calc(10px + var(--safe-b));border-top:1px solid var(--line);background:var(--desk)}
.chat-input textarea{flex:1;resize:none;height:44px;max-height:120px;border:1.5px solid var(--line);border-radius:22px;
  padding:10px 15px;background:var(--surface);font-size:16px;line-height:1.35;outline:none}
.chat-input textarea:focus{border-color:var(--ink)}
.chat-input .send{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
.chat-input .send svg{width:20px;height:20px}
.chat-input .send[disabled]{opacity:.35}

/* ============ Кнопка вне Telegram ============ */
.cta{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));
  width:calc(100% - 2*var(--gutter));max-width:480px;height:56px;border-radius:14px;
  background:var(--ink);color:var(--on-ink);font-weight:650;font-size:17px;z-index:6;
  box-shadow:0 12px 26px -12px rgba(36,51,196,.6)}
.cta[disabled]{opacity:.45}
.no-tg .cta.on{display:block}

@media (prefers-reduced-motion:reduce){
  .film-hint svg{animation:none}
  .screen,.receipt .stamp.land{animation:none}
  .progress .bar i,.opt,.toggle .sw,.toggle .sw::after{transition:none}
  .msg.new,.quick.new,.typing i{animation:none}
}
</style>

const fmtRange = ([a,b]) => a === b ? `${a}` : `${a}–${b}`;
const plural = (n, f) => { const m10=n%10, m100=n%100; return f[(m10===1&&m100!==11)?0:(m10>=2&&m10<=4&&(m100<10||m100>=20))?1:2]; };
const weeksText = ([a,b]) => `${a === b ? a : a + "–" + b} ${plural(b, ["неделя","недели","недель"])}`;

function estimate(){
  const s = svc(), sc = scl(); if (!s || !sc) return null;
  const items = [{ label: sc.title, price: sc.price }];
  let min = sc.price[0], max = sc.price[1], wk = 0, monthly = null;
  for (const e of s.extras){
    if (!S.extras.has(e.id)) continue;
    if (e.monthly){ monthly = e.monthly; continue; }
    items.push({ label: e.title, price: e.price }); min += e.price[0]; max += e.price[1]; wk += e.weeks || 0;
  }
  const u = urg() || URGENCY[0];
  min = r5(min * u.k); max = r5(max * u.k);
  let wMin = sc.weeks[0] + Math.floor(wk / 2), wMax = Math.ceil(sc.weeks[1] + wk);
  wMin = Math.max(1, Math.round(wMin * u.w)); wMax = Math.max(wMin, Math.round(wMax * u.w));
  return { items, min, max, weeks:[wMin, wMax], monthly, rush: u.k > 1 };
}

/* ==========================================================
   Покадровая анимация на скролле
   ========================================================== */
const FILM = {
  count: 139,                                              // кадров в папке frames/
  src: i => `frames/f${String(i).padStart(3, "0")}.webp`,
  w: 840, h: 1315,                                         // размер кадра
  bg: "#DFE2F8",                                           // фон видео
  ring: { x: .5, y: .5, d: .226 },                         // кольцо в финале: центр и диаметр (доля ширины кадра)
  fill: .78,                                               // какую часть высоты экрана занимает кадр
};
const filmImgs = new Array(FILM.count);
let filmLoading = false, film = null;

function preloadFilm(){
  if (filmLoading) return; filmLoading = true;
  // сначала первый и последний кадр, потом каждый 16-й, 8-й… — анимация работает ещё до полной загрузки
  const order = [0, FILM.count - 1], seen = new Set(order);
  for (const step of [16, 8, 4, 2, 1])
    for (let i = 0; i < FILM.count; i += step) if (!seen.has(i)) { seen.add(i); order.push(i); }
  let k = 0, active = 0;
  const pump = () => {
    while (active < 6 && k < order.length){
      const i = order[k++], im = new Image(); active++;
      im.decoding = "async";
      im.onload = () => { filmImgs[i] = im; active--; if (film) film.loaded(i); pump(); };
      im.onerror = () => { active--; pump(); };
      im.src = FILM.src(i);
    }
  };
  pump();
}
function nearestFrame(i){
  if (filmImgs[i]) return filmImgs[i];
  for (let d = 1; d < FILM.count; d++){
    if (filmImgs[i - d]) return filmImgs[i - d];
    if (filmImgs[i + d]) return filmImgs[i + d];
  }
  return null;
}
function stageHeight(){
  const h = IN_TG && tg.viewportStableHeight ? tg.viewportStableHeight : window.innerHeight;
  document.documentElement.style.setProperty("--stage-h", Math.round(h) + "px");
}

function mountFilm(){
  const root = app.querySelector(".film");
  if (!root){ film = null; return; }
  const stage = root.querySelector(".film-stage"), canvas = root.querySelector("canvas"), ctx = canvas.getContext("2d");
  const chs = [...root.querySelectorAll(".ch")].map(el => ({ el, from:+el.dataset.from, to:+el.dataset.to }));
  const stamp = root.querySelector(".film-stamp");
  const smooth = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : .18;
  const clamp = v => Math.min(1, Math.max(0, v));
  const ease = t => 1 - Math.pow(1 - t, 3);
  let W = 0, H = 0, dpr = 1, box = null, target = 0, cur = 0, raf = 0, shown = null, landed = false;

  function layout(){
    W = stage.clientWidth; H = stage.clientHeight; dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    const s = Math.max(W / FILM.w, H * FILM.fill / FILM.h);
    const w = FILM.w * s, h = FILM.h * s;
    box = { x:(W - w) / 2, y:H - h, w, h };
    root.style.setProperty("--copy-h", Math.max(box.y + 56, 170) + "px");
    const size = FILM.ring.d * w * 200 / 110;               // внутренний круг печати (r=55 из 200) = кольцо из видео
    Object.assign(stamp.style, { width:size + "px", height:size + "px",
      left:(box.x + w * FILM.ring.x - size / 2) + "px", top:(box.y + h * FILM.ring.y - size / 2) + "px" });
    shown = null; paint();
  }
  function progress(){
    const r = root.getBoundingClientRect(), total = root.offsetHeight - H;
    return total > 0 ? clamp(-r.top / total) : 0;
  }
  function paint(){
    const f = Math.round(cur * (FILM.count - 1)), im = nearestFrame(f);
    if (im && im !== shown){
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = FILM.bg; ctx.fillRect(0, 0, W, H);
      ctx.drawImage(im, box.x, box.y, box.w, box.h);
      shown = im;
    }
    const fade = .035;
    for (const c of chs){
      const o = clamp((cur - c.from) / fade) * clamp((c.to - cur) / fade);
      c.el.style.opacity = o.toFixed(3);
      c.el.style.transform = `translateY(${((1 - o) * (cur < c.from + fade ? 12 : -12)).toFixed(1)}px)`;
      c.el.style.visibility = o > 0 ? "visible" : "hidden";
    }
    // печать опускается на кольцо
    const t = clamp((cur - .9) / .07), e = ease(t);
    stamp.style.opacity = t > 0 ? Math.min(1, t * 1.8).toFixed(3) : "0";
    stamp.style.transform = `scale(${(1.45 - .45 * e).toFixed(3)}) rotate(${(30 - 38 * e).toFixed(2)}deg)`;
    if (t >= 1 && !landed){ landed = true; haptic.thud(); }
    if (t < .5) landed = false;
  }
  function tick(){
    cur += (target - cur) * smooth;
    if (Math.abs(target - cur) < .0004) cur = target;
    paint();
    raf = cur !== target ? requestAnimationFrame(tick) : 0;
  }
  const api = {
    scroll(){ target = progress(); if (!raf) raf = requestAnimationFrame(tick); },
    layout,
    loaded(i){ if (Math.abs(i - cur * (FILM.count - 1)) <= 16){ shown = null; paint(); } },
  };
  film = api;
  layout(); api.scroll();
}

window.addEventListener("scroll", () => { if (film) film.scroll(); }, { passive:true });
window.addEventListener("resize", () => { stageHeight(); if (film) film.layout(); });

function mountChat(){
  const log = app.querySelector("#chatlog");
  document.documentElement.classList.toggle("chat-open", !!log);
  if (!log) return;
  log.innerHTML = "";
  CH.log.forEach((m, i) => log.appendChild(msgEl(m, i === CH.log.length - 1)));
  scrollChat(true);
  const form = app.querySelector("#chatform"), input = app.querySelector("#chatinput"), sendBtn = form.querySelector(".send");
  const grow = () => { input.style.height = "44px"; input.style.height = Math.min(120, input.scrollHeight) + "px";
    sendBtn.disabled = !input.value.trim(); };
  input.addEventListener("input", grow);
  input.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); form.requestSubmit(); } });
  form.onsubmit = ev => { ev.preventDefault(); const t = input.value.trim(); if (!t) return;
    input.value = ""; grow(); userText(t); };
  app.querySelector("[data-act=chat-reset]").onclick = () => {
    CH = chatNew(); chatSave(); log.innerHTML = ""; chatStart();
  };
  if (!CH.started) chatStart(CH.preset);
}

function msgEl(m, isLast){
  const frag = document.createDocumentFragment();
  if (m.html){
    const d = document.createElement("div");
    d.className = m.who === "sys" ? "sys" : `msg ${m.who}`;
    d.innerHTML = m.html;
    frag.appendChild(d);
  }
  if (m.quick && m.quick.length && !m.done){
    const q = document.createElement("div");
    q.className = "quick";
    m.quick.forEach((b, i) => {
      const el = document.createElement("button");
      el.type = "button";
      el.textContent = b.label;
      if (b.cls) el.className = b.cls;
      el.onclick = () => onQuick(m, b);
      q.appendChild(el);
    });
    frag.appendChild(q);
  }
  return frag;
}

function scrollChat(instant){
  const log = app.querySelector("#chatlog"); if (!log) return;
  log.scrollTo({ top: log.scrollHeight, behavior: instant || FAST ? "auto" : "smooth" });
}

function pushMsg(m){
  CH.log.push(m); chatSave();
  const log = app.querySelector("#chatlog");
  if (log){
    const el = msgEl(m, true);
    [...el.children].forEach(c => c.classList.add("new"));
    log.appendChild(el); scrollChat();
  }
}

let sayQueue = Promise.resolve();
const sleep = ms => new Promise(r => setTimeout(r, ms));
function say(html, quick){
  sayQueue = sayQueue.then(async () => {
    const log = app.querySelector("#chatlog");
    if (!FAST && log){
      const t = document.createElement("div"); t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
      log.appendChild(t); scrollChat();
      await sleep(Math.min(1100, 380 + html.replace(/<[^>]+>/g, "").length * 6));
      t.remove();
    }
    pushMsg({ who:"bot", html, quick: quick || [] });
  });
  return sayQueue;
}
function me(text){ closeQuick(); pushMsg({ who:"me", html: esc(text) }); haptic.tap(); }
function sys(text){ pushMsg({ who:"sys", html: esc(text) }); }
function closeQuick(){
  let changed = false;
  CH.log.forEach(m => { if (m.quick && m.quick.length && !m.done){ m.done = true; changed = true; } });
  if (changed){ chatSave(); app.querySelectorAll("#chatlog .quick").forEach(q => q.remove()); }
}

/* ---------- кнопки ---------- */
const Q = (label, val, cls) => ({ label, val, cls });
function onQuick(m, b){
  if (m.done) return;
  me(b.label);
  const [kind, ...rest] = String(b.val).split(":");
  const arg = rest.join(":");
  if (kind === "s") return answerChoice(arg.split("=")[0], arg.split("=")[1]);
  if (kind === "faq") return faqAnswer(arg);
  if (kind === "svc") return serviceInfo(arg);
  if (kind === "go") return actions[arg] && actions[arg]();
  if (kind === "quizneed") return beginQuiz({ need: arg });
}
const actions = {
  quiz: () => beginQuiz(),
  prices: () => showPrices(),
  faq: () => say("Частые вопросы — выберите или напишите свой:", CHAT.faq.map(f => Q(f[1], "faq:" + f[0], "wide"))),
  dm: () => openOwnerChat(chatDmText(), true),
  ask_now: () => openOwnerChat(chatQuestionText(), true),
  menu: () => chatMenu(),
  resume: () => CH.await ? ask(CH.await) : chatMenu(),
  resend: () => openOwnerChat(chatLeadText(), false),
  copy: () => copyText(chatLeadText()).then(ok => say(ok ? "Скопировал текст заявки — можно вставить в любой мессенджер." : "Не получилось скопировать — откройте чат кнопкой выше.")),
  home: () => { trail.length = 0; go("home", { back:true }); },
  calc: () => { trail.length = 0; trail.push("home"); go("service"); },
};

}

function serviceInfo(id, inStep){
  const s = svcBy(id); if (!s) return;
  const rows = s.scales.map(x => `• ${x.title} — ${fmtRange(x.price)} тыс ₽, ${weeksText(x.weeks)}`).join("<br>");

  if (inStep) return say(html);
  say(html, [Q(`🎯 Подобрать ${needShort[id]}`, "quizneed:" + id, "primary"), Q("💰 Все цены", "go:prices")]);

/* ---------- анкета ---------- */
function beginQuiz(preset){
  const keep = {}; ["name","phone"].forEach(k => { if (CH.a[k]) keep[k] = CH.a[k]; });
  CH.a = Object.assign(keep, preset || {}); CH.flow = "quiz"; CH.confirming = false; CH.sent = false;
  say("Подберём решение — это 1–2 минуты, в основном кнопками. В любой момент можно задать вопрос текстом.");
  askNext();
}
function budgetMax(a){ const b = CHAT.budgets.find(x => x[0] === a.budget); return b ? b[2] : null; }
function needed(step){
  const a = CH.a;
  if (step in a) return false;
  switch (step){
    case "goal": return a.need === "unknown";
    case "recommend": return a.need === "unknown" && "goal" in a;
    case "link": return ["site","tilda","social"].includes(a.assets);
    case "scale": return !!a.need && a.need !== "unknown";
    case "budget_fit": { const s = scaleOf(a), mx = budgetMax(a); return !!(s && mx !== null && s.price[0] > mx); }
    case "phone": return ["call","wa"].includes(a.contact_way) && !a.phone;
    case "call_time": return ["call","wa"].includes(a.contact_way);
    case "name": return !a.name;
  }
  return true;
}
const nextStep = () => FLOW.find(needed);
const remaining = () => FLOW.filter(s => s !== "confirm" && needed(s)).length;
function askNext(){
  const step = nextStep();
  if (!step) return chatMenu();
  if (step === "confirm") CH.confirming = true;
  ask(step);
}
function ask(step){
  if (step.endsWith("_text")) step = step.slice(0, -5);
  if (step === "edit_pick") step = "confirm";
  CH.await = step; chatSave();
  const a = CH.a, opts = list => list.map(([v, t]) => Q(t, `s:${step}=${v}`));
  let q = "", quick = [];
  switch (step){
    case "niche": q = "Чем занимается ваш бизнес?"; quick = opts(CHAT.niches); break;
    case "need": q = a.self_pick ? "Выберите, что вам ближе:" : "Что нужно сделать?";
      quick = opts(CHAT.needs.filter(n => !(a.self_pick && n[0] === "unknown"))); break;
    case "goal": q = "Подскажу! Какая главная задача сейчас?"; quick = opts(CHAT.goals).map(b => (b.cls = "wide", b)); break;
    case "recommend": {
      const [need, sc, why] = CHAT.recommend[a.goal], s = svcBy(need), x = s.scales.find(v => v.id === sc);
      q = `Под вашу задачу подойдёт: <b>${s.title} — ${x.title}</b><br>${why}<br><br>Ориентир: ${fmtRange(x.price)} тыс ₽, ${weeksText(x.weeks)}. Подходит?`;
      quick = [Q("👍 Подходит", "s:recommend=ok", "primary"), Q("Выберу сам", "s:recommend=self")]; break; }
    case "assets": q = "Что у вас уже есть?"; quick = opts(CHAT.assets); break;
    case "link": q = "Пришлите ссылку на сайт или соцсети — Дмитрий посмотрит перед разговором."; quick = [Q("Пропустить", "s:link=skip")]; break;
    case "scale": { const s = svcBy(a.need);
      q = `<b>${s.title}</b> — какой вариант ближе? Цены в тыс ₽.`;
      quick = s.scales.map(x => Q(`${x.title} · ${fmtRange(x.price)}`, `s:scale=${x.id}`, "wide"))
        .concat([Q("🤷 Не знаю, нужен совет", "s:scale=advice", "wide")]); break; }
    case "budget": q = "На какой бюджет ориентируетесь? Можно написать сумму."; quick = opts(CHAT.budgets); break;
    case "budget_fit": { const s = svcBy(a.need), x = scaleOf(a), mx = budgetMax(a);
      q = `«${x.title}» обычно стоит ${fmtRange(x.price)} тыс ₽ — это выше бюджета. Есть варианты:`;
      quick = s.scales.filter(v => v.price[0] <= mx && v.id !== x.id).slice(0, 3)
        .map(v => Q(`Взять «${v.title}» · ${fmtRange(v.price)}`, `s:budget_fit=sc_${v.id}`, "wide"))
        .concat([Q("🪜 Сделать поэтапно", "s:budget_fit=stage", "wide"), Q("Оставить выбранный вариант", "s:budget_fit=keep", "wide"),
          Q(`Обсудить с ${CONFIG.OWNER_INS}`, "s:budget_fit=talk", "wide")]); break; }
    case "deadline": q = "Когда нужно запустить?"; quick = opts(CHAT.deadlines); break;
    case "contact_way": q = `Как ${CONFIG.OWNER_DAT} лучше связаться с вами?`; quick = opts(CHAT.ways); break;
    case "phone": q = "Ваш номер телефона?";
      quick = (can("6.9") ? [Q("📱 Поделиться номером", "s:phone=share", "primary")] : []).concat([Q("Пропустить", "s:phone=skip")]);
      if (!can("6.9")) q += " Напишите его сообщением.";
      break;
    case "call_time": q = "Когда удобно поговорить? (по Москве)"; quick = opts(CHAT.times); break;
    case "name": { const n = tgUser && tgUser.first_name;
      q = "Как к вам обращаться?" + (n ? "" : " Напишите имя.");
      quick = n ? [Q(n.slice(0, 30), "s:name=tg"), Q("✏️ Другое имя", "s:name=other")] : []; break; }
    case "comment": q = "Хотите что-то добавить? Например, пожелания или пример сайта, который нравится."; quick = [Q("Пропустить", "s:comment=skip")]; break;
    case "confirm": q = leadSummaryHtml() + "<br>Всё верно?";
      quick = [Q(`✈️ Отправить ${CONFIG.OWNER_DAT}`, "s:confirm=send", "primary wide"), Q("✏️ Изменить ответ", "s:confirm=edit"), Q("✖️ Отменить", "s:confirm=cancel")]; break;
  }
  const left = remaining();
  if (!["confirm","recommend","budget_fit"].includes(step) && !CH.confirming && left > 1) q += `<br><small style="color:var(--muted)">Осталось вопросов: ${left}</small>`;
  say(q, quick);
}

function answerChoice(step, val){
  const a = CH.a;
  if (step !== CH.await && !(step === "edit_pick" && CH.await === "edit_pick")) return;
  switch (step){
    case "niche": if (val === "other"){ CH.await = "niche_text"; chatSave(); return say("Напишите в двух словах, чем занимаетесь."); }
      a.niche = lbl(CHAT.niches, val); break;
    case "need": a.need = val; ["scale","budget_fit","goal"].forEach(k => delete a[k]); break;
    case "goal": a.goal = val; break;
    case "recommend": { const [need, sc] = CHAT.recommend[a.goal];
      if (val === "ok"){ a.need = need; a.scale = sc; a.recommend = "принял рекомендацию"; }
      else { delete a.need; a.self_pick = true; a.recommend = "выбрал сам"; } break; }
    case "assets": if (val === "other"){ CH.await = "assets_text"; chatSave(); return say("Что именно есть? Напишите коротко."); }
      a.assets = val; break;
    case "link": a.link = "—"; break;
    case "scale": a.scale = val; delete a.budget_fit; break;
    case "budget": a.budget = val; delete a.budget_fit; delete a.budget_text; break;
    case "budget_fit": a.budget_fit = val.startsWith("sc_") ? (a.scale = val.slice(3), "выбрал вариант под бюджет")
      : { stage:"хочет поэтапно", keep:"оставил вариант дороже бюджета", talk:`хочет обсудить с ${CONFIG.OWNER_INS}` }[val]; break;
    case "deadline": a.deadline = val; break;
    case "contact_way": a.contact_way = val; if (val === "tg") delete a.call_time; break;
    case "phone":
      if (val === "share") return requestPhone();
      a.contact_way = "tg"; delete a.call_time; say(`Хорошо, ${CONFIG.OWNER_NAME} напишет вам в Telegram.`); break;
    case "call_time": if (val === "other"){ CH.await = "call_time_text"; chatSave(); return say("Напишите удобное время, например: «завтра после 14»."); }
      a.call_time = lbl(CHAT.times, val); break;
    case "name": if (val === "other"){ CH.await = "name"; chatSave(); return say("Напишите, как к вам обращаться."); }
      a.name = tgUser.first_name.slice(0, 40); break;
    case "comment": a.comment = "—"; break;
    case "confirm":
      if (val === "send") return sendLead();
      if (val === "cancel"){ Object.assign(CH, { await:"", flow:"", confirming:false }); chatSave();
        return chatMenu("Отменил — ответы не отправлены. Если передумаете, я здесь."); }
      if (val === "edit"){ CH.await = "edit_pick"; chatSave();
        const fields = ["niche","need","assets","scale","budget","deadline","contact_way","name","comment"];
        return say("Что исправить?", fields.map(f => Q(STEP_NAMES[f], `s:edit_pick=${f}`)).concat([Q("← Назад к проверке", "s:edit_pick=back")])); }
      break;
    case "edit_pick":
      if (val !== "back"){
        const drop = { need:["need","goal","recommend","self_pick","scale","budget_fit"], scale:["scale","budget_fit"],
          budget:["budget","budget_fit","budget_text"], assets:["assets","link","assets_text"], contact_way:["contact_way","phone","call_time"] };
        (drop[val] || [val]).forEach(k => delete a[k]);
      }
      CH.confirming = true; break;
  }
  chatSave(); askNext();
}

function requestPhone(){
  if (!can("6.9")) return say("Напишите номер сообщением, например +7 921 123-45-67.");
  tg.requestContact((ok, res) => {
    const phone = ok && res && res.responseUnsafe && res.responseUnsafe.contact && res.responseUnsafe.contact.phone_number;
    if (phone){ CH.a.phone = normPhone(phone) || phone; sys(`Номер: ${CH.a.phone}`); chatSave(); askNext(); }
    else say("Номер не пришёл — напишите его сообщением или нажмите «Пропустить».", [Q("Пропустить", "s:phone=skip")]);
  });
}
function normPhone(t){
  const d = String(t).replace(/\D/g, "");
  if (d.length === 11 && /[78]/.test(d[0])) return `+7 ${d.slice(1,4)} ${d.slice(4,7)}-${d.slice(7,9)}-${d.slice(9)}`;
  if (d.length === 10 && d[0] === "9") return `+7 ${d.slice(0,3)} ${d.slice(3,6)}-${d.slice(6,8)}-${d.slice(8)}`;
  if (d.length >= 10 && d.length <= 15 && String(t).trim().startsWith("+")) return "+" + d;
  return null;
}

/* ---------- текст от клиента ---------- */
function detect(text){
  const t = text.toLowerCase().replace(/ё/g, "е");
  const hit = CHAT.intents.find(([, rx]) => rx.test(t));
  return hit ? hit[0] : null;
}
function userText(text){
  me(text);
  const step = CH.await, a = CH.a, intent = detect(text), question = /\?\s*$/.test(text);
  if (intent === "menu") return chatMenu("Хорошо. Чем помочь?");
  if (step.endsWith("_text")){
    const base = step.slice(0, -5);
    if (base === "assets"){ a.assets = "other"; a.assets_text = text.slice(0, 200); }
    else a[base] = text.slice(0, 120);
    chatSave(); return askNext();
  }
  if (step === "edit_pick") return say("Выберите кнопкой, что исправить 👆");
  if (step === "budget" && /\d/.test(text) && !question) return budgetFromText(text);
  if (TEXT_STEPS.has(step) && !question && intent !== "human") return answerText(step, text);
  if (step === "need" && intent && intent.startsWith("svc:") && !question){ closeQuick(); return answerChoice("need", intent.slice(4)); }
  if (step === "contact_way" && !question){
    const way = [["wa", /whats|ватс|вотс|вацап/], ["call", /позвон|звон|набер|телефон/], ["tg", /телеграм|telegram|(^|\s)тг(\s|$)|пиши|переписк/]]
      .find(([, rx]) => rx.test(text.toLowerCase()));
    if (way) return answerChoice("contact_way", way[0]);
  }
  const intercept = INTERCEPT.has(intent) || (intent || "").startsWith("faq:");
  if (FREE_TEXT_OK.has(step) && !question && !intercept){
    if (step === "assets"){ a.assets = "other"; a.assets_text = text.slice(0, 200); }
    else a[step] = text.slice(0, 120);
    chatSave(); return askNext();
  }
  if (freeText(text, intent, !!step)){ if (step) reask(); return; }
  // не понял — сохраняем вопрос для Дмитрия
  (a.questions = a.questions || []).push(text.slice(0, 300)); chatSave();
  say(`Хороший вопрос — точно ответит ${CONFIG.OWNER_NAME}. Добавлю его в заявку 📝`,
    [Q(`Спросить ${CONFIG.OWNER_DAT} сейчас`, "go:ask_now")].concat(step ? [] : [Q("🎯 Подобрать решение", "go:quiz")]));
  if (step) reask();
}
function reask(){ if (CH.await){ say("Вернёмся к подбору 👇"); ask(CH.await); } }
function freeText(text, intent, inStep){
  if (!intent) return false;
  if (intent.startsWith("faq:")){ faqAnswer(intent.slice(4), inStep); return true; }
  if (intent.startsWith("svc:")){ serviceInfo(intent.slice(4), inStep); return true; }
  if (intent === "human"){
    say(`Конечно! Можно написать ${CONFIG.OWNER_DAT} напрямую — откроется чат с ним в Telegram.`,
      [Q(`✈️ Написать ${CONFIG.OWNER_DAT}`, "go:dm", "primary")].concat(inStep ? [] : [Q("Сначала подобрать решение", "go:quiz")]));
    return true;
  }
  if (intent === "price"){ inStep ? say("Цены зависят от задачи — точную вилку покажу в конце подбора.") : showPrices(); return true; }
  if (intent === "greet"){ inStep ? say("Здравствуйте! 👋") : chatMenu("Здравствуйте! Чем помочь?"); return true; }
  if (intent === "thanks"){ inStep ? say("Пожалуйста! 🙌") : chatMenu("Пожалуйста! 🙌 Чем ещё помочь?"); return true; }
  return false;
}
function budgetFromText(text){
  const nums = (text.replace(/\s/g, "").match(/\d+(?:[.,]\d+)?/g) || []).map(x => parseFloat(x.replace(",", ".")));
  let n = Math.max(...nums);
  if (/млн|миллион/.test(text.toLowerCase())) n *= 1000; else if (n >= 1000) n /= 1000;
  CH.a.budget = CHAT.budgets.find(b => b[2] !== null && n <= b[2])[0];
  CH.a.budget_text = text.slice(0, 80); delete CH.a.budget_fit;
  chatSave(); askNext();
}
function answerText(step, text){
  const a = CH.a;
  if (step === "phone"){
    if (/^пропуст/i.test(text)) return answerChoice("phone", "skip");
    const p = normPhone(text);
    if (!p){
      CH.tries = (CH.tries || 0) + 1;
      if (CH.tries < 3) return say("Похоже, в номере опечатка. Пример: +7 921 123-45-67 — или нажмите «Пропустить».", [Q("Пропустить", "s:phone=skip")]);
      a.phone = text.slice(0, 30) + " (не проверен)";
    } else a.phone = p;
    CH.tries = 0;
  }
  if (step === "link") a.link = text.slice(0, 300);
  if (step === "name"){
    if (text.length < 2 || text.length > 40) return say("Напишите, пожалуйста, просто имя — например, «Анна».");
    a.name = text;
  }
  if (step === "comment") a.comment = text.slice(0, 1000);
  chatSave(); askNext();
}

/* ---------- итог и отправка ---------- */
function chatEstimate(a){
  const x = scaleOf(a); if (!x) return null;
  const k = a.deadline === "rush" ? 1.25 : 1;
  return { min: r5(x.price[0] * k), max: r5(x.price[1] * k), weeks: weeksText(x.weeks) };
}
function contactLine(a){
  const way = { tg:"Telegram", call:"Позвонить", wa:"WhatsApp" }[a.contact_way || "tg"];
  return [way, a.phone, a.call_time].filter(Boolean).join(", ");
}
function leadRows(a){
  const x = scaleOf(a), s = svcBy(a.need);
  let task = s ? s.title : "";
  if (x) task += ` — ${x.title}`; else if (a.scale === "advice") task += " — нужен совет по варианту";
  let assets = a.assets_text || lbl(CHAT.assets, a.assets);
  if (a.link && a.link !== "—") assets += ` (${a.link})`;
  return [
    ["Сфера", a.niche], ["Задача", task],
    ["Цель", a.goal ? lbl(CHAT.goals, a.goal) : ""],
    ["Что уже есть", a.assets ? assets : ""],
    ["Бюджет", (a.budget_text || lbl(CHAT.budgets, a.budget)) + (a.budget_fit ? ` (${a.budget_fit})` : "")],
    ["Сроки", CHAT.deadlines.some(d => d[0] === a.deadline) ? lbl(CHAT.deadlines, a.deadline) : a.deadline],
    ["Связь", contactLine(a)], ["Имя", a.name],
    ["Комментарий", a.comment && a.comment !== "—" ? a.comment : ""],
  ].filter(([, v]) => v && String(v).trim());
}
function leadSummaryHtml(){
  const a = CH.a, e = chatEstimate(a);
  let h = `<b>Проверьте, всё ли верно:</b><div class="rows">` +
    leadRows(a).map(([k, v]) => `<div><span>${k}:</span> ${esc(v)}</div>`).join("") + `</div>`;
  if (e) h += `<div class="est">Предварительно: <b>${e.min}–${e.max} тыс ₽</b>, ${e.weeks}${a.deadline === "rush" ? " (срочно, +25%)" : ""}.<br>
    Точную сумму ${CONFIG.OWNER_NAME} назовёт после бесплатного разбора. Предоплаты нет.</div>`;
  return h;
}
function chatLeadText(){
  const a = CH.a, e = chatEstimate(a);
  const lines = [`Здравствуйте, ${CONFIG.OWNER_NAME}! Заявка из приложения ${CONFIG.BRAND}:`, ""]
    .concat(leadRows(a).map(([k, v]) => `${k}: ${v}`));
  if (e) lines.push(`Ориентир: ${e.min}–${e.max} тыс ₽, ${e.weeks}`);
  if (a.questions && a.questions.length) lines.push("", "Мои вопросы:", ...a.questions.map(q => "— " + q));
  return lines.join("\n").slice(0, 3900);
}
function chatDmText(){
  const a = CH.a, rows = leadRows(a);
  return `Здравствуйте, ${CONFIG.OWNER_NAME}! Пишу из приложения ${CONFIG.BRAND}.` +
    (rows.length ? "\n\n" + rows.map(([k, v]) => `${k}: ${v}`).join("\n") : "") +
    (a.questions && a.questions.length ? "\n\nВопрос: " + a.questions[a.questions.length - 1] : "");
}
function chatQuestionText(){
  const q = (CH.a.questions || []).slice(-1)[0] || "";
  return `Здравствуйте, ${CONFIG.OWNER_NAME}! Вопрос из приложения ${CONFIG.BRAND}: ${q}`;
}
function promise(a){
  const t = (a.call_time || "").toLowerCase();
  if (a.contact_way === "call") return t ? `позвонит: ${t}` : "позвонит в течение рабочего дня";
  if (a.contact_way === "wa") return t ? `напишет в WhatsApp: ${t}` : "напишет в WhatsApp";
  return "ответит вам в Telegram в течение рабочего дня";
}
function sendLead(){
  CH.sent = true; CH.await = ""; CH.flow = ""; CH.confirming = false; chatSave();
  openOwnerChat(chatLeadText(), false);
  haptic.ok();
  say(`Открываю чат с ${CONFIG.OWNER_INS} — там уже готов текст заявки. <b>Нажмите «Отправить»</b> ✈️<br><br>${CONFIG.OWNER_NAME} ${promise(CH.a)}.`,
    [Q("Открыть чат ещё раз", "go:resend", "primary"), Q("📋 Скопировать текст", "go:copy"), Q("☰ Меню", "go:menu")]);
}
function openOwnerChat(text, withNote){
  const u = CONFIG.OWNER_USERNAME.replace(/^@/, "");
  const url = `https://t.me/${u}?text=${encodeURIComponent(text)}`;
  if (withNote) say(`Открываю чат с ${CONFIG.OWNER_INS} — нажмите «Отправить» в Telegram.`);
  if (IN_TG) tg.openTelegramLink(url);
  else { const w = window.open(url, "_blank"); if (!w) location.href = url; }
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e) {}
  try { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    const ok = document.execCommand("copy"); t.remove(); return ok; } catch(e) { return false; }
}
function openChat(preset){
  if (preset && CH.started){ if (S.screen !== "chat") go("chat"); return beginQuiz(preset); }
  if (preset) CH.preset = preset;
  if (S.screen !== "chat") go("chat");
}

/* ==========================================================
   Старт
   ========================================================== */
document.title = `${CONFIG.BRAND} — расчёт проекта`;
if (IN_TG){
  tg.ready(); tg.expand();
  if (can("7.7")) tg.disableVerticalSwipes();
  tg.onEvent("themeChanged", applyTheme);
  tg.onEvent("viewportChanged", e => { if (e && e.isStateStable){ stageHeight(); if (film) film.layout(); } });
} else {
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
}
stageHeight();
preloadFilm();
chatLoad();
applyTheme();
render();
</script>
